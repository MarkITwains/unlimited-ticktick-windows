name: Build and Release Patched TickTick

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify TickTick.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick.exe")) {
            Write-Error "TickTick.exe not found in repository root. Commit it to the repo and re-run."
            exit 1
          }
          $header = Get-Content -Path "TickTick.exe" -AsByteStream -TotalCount 2
          if (-not ($header.Length -eq 2 -and $header[0] -eq 0x4D -and $header[1] -eq 0x5A)) {
            Write-Error "TickTick.exe in repository root is not a valid Windows executable (missing MZ header)."
            exit 1
          }
          Write-Host "Found valid TickTick.exe ($([math]::Round((Get-Item 'TickTick.exe').Length/1MB, 2)) MB) in repository root."

      - name: Run Patcher
        # We can just build and run directly via dotnet run
        run: dotnet run -- "TickTick.exe"

      - name: Prepare Release Package
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patching failed: TickTick_Patched.exe not generated."
            exit 1
          }
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
