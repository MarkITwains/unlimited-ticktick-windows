name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Direct URL to your original TickTick.exe file"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup
        shell: pwsh
        run: |
          function Test-PortableExecutable([string]$path) {
            if (-not (Test-Path $path)) { return $false }
            $header = Get-Content -Path $path -AsByteStream -ReadCount 2 -TotalCount 2
            return $header.Length -eq 2 -and $header[0] -eq 0x4D -and $header[1] -eq 0x5A
          }

          $downloadUrl = "${{ inputs.app_url }}"
          Write-Host "Downloading target file from $downloadUrl..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile "TickTick.exe"

          if (-not (Test-PortableExecutable "TickTick.exe")) {
            $uri = [Uri]$downloadUrl
            $pathParts = $uri.AbsolutePath.Trim('/').Split('/')
            $isFilebinBucketUrl = $uri.Host -ieq "filebin.net" -and $pathParts.Length -eq 1 -and $pathParts[0]

            if ($isFilebinBucketUrl) {
              $bucket = $pathParts[0]
              $listingHtml = Get-Content -Path "TickTick.exe" -Raw
              $match = [regex]::Match($listingHtml, "href=""/$bucket/([^""#?]+)""")
              if ($match.Success) {
                $fileName = $match.Groups[1].Value
                $resolvedDownloadUrl = "https://filebin.net/$bucket/$fileName"
                Write-Host "Detected a filebin bucket URL. Downloading: $resolvedDownloadUrl"
                Invoke-WebRequest -Uri $resolvedDownloadUrl -OutFile "TickTick.exe"
              }
            }
          }

          if (-not (Test-PortableExecutable "TickTick.exe")) {
            Write-Error "Downloaded file is not a valid Windows executable. Please provide a direct download URL to TickTick.exe."
            exit 1
          }

      - name: Run Patcher
        # We can just build and run directly via dotnet run
        run: dotnet run -- "TickTick.exe"

      - name: Prepare Release Package
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patching failed: TickTick_Patched.exe not generated."
            exit 1
          }
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
